<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{product/fragments/header :: head(${pageTitle})}">
</head>

<body>

<div th:replace="~{product/fragments/navbar :: navbar}"></div>

<main class="page-container">

    <div th:replace="~{product/fragments/alerts :: alerts}"></div>


    <div class="page-header">

        <div>

            <h1>
                Active Products
            </h1>

            <p>
                Products that are currently active in your catalog.
            </p>

        </div>

        <div class="header-actions">

            <a th:href="@{/products/create}"
               class="btn btn-primary">

                +
                Add Product

            </a>

        </div>

    </div>


    <div class="card">

        <div class="card-header">

            <strong>
                Active Products
            </strong>

        </div>


        <div class="table-container">

            <table class="product-table">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Product</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Actions</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.id}">
                        1
                    </td>


                    <td>

                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="product-name"
                           th:text="${product.name}">

                            Product Name

                        </a>

                    </td>


                    <td>

                        <div class="product-description"
                             th:text="${product.description != null
                                       ? product.description
                                       : 'No description'}">

                            Description

                        </div>

                    </td>


                    <td>

                        <span class="product-price"
                              th:text="${'₹ ' + product.price}">

                            ₹ 999.00

                        </span>

                    </td>


                    <td>

                        <span class="category-badge"
                              th:text="${product.category}">

                            ELECTRONICS

                        </span>

                    </td>


                    <td>

                        <span class="status-badge status-active">
                            Active
                        </span>

                    </td>


                    <td>

                        <div class="action-buttons">

                            <a th:href="@{/products/{id}(id=${product.id})}"
                               class="action-btn"
                               title="View">

                                👁

                            </a>


                            <a th:href="@{/products/{id}/edit(id=${product.id})}"
                               class="action-btn"
                               title="Edit">

                                ✎

                            </a>

                        </div>

                    </td>

                </tr>


                <tr th:if="${#lists.isEmpty(products)}">

                    <td colspan="7">

                        <div class="empty-state">

                            <div class="empty-icon">
                                ✓
                            </div>

                            <h3>
                                No Active Products
                            </h3>

                            <p>
                                There are currently no active products.
                            </p>

                            <a th:href="@{/products}"
                               class="btn btn-secondary">

                                View All Products

                            </a>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

<div th:replace="~{product/fragments/footer :: footer}"></div>

</body>
</html>
